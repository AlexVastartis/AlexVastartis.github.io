name: Refresh data

# Regenerates public/data/*.json from the maintained CSVs + the CollegeFootballData
# API, and commits the result if anything changed. The deploy host redeploys on push.
#
# Schedule: every Sunday 12:00 UTC (~08:00 ET). Most of these stats are all-time
# figures that move at most once a week in-season, so weekly year-round is plenty.
# To change cadence, edit the cron below (https://crontab.guru).

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Refresh the CFBD store
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/build-api-store.mjs

      - name: Rebuild data (no network)
        run: node scripts/build-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data data/api data/season-records.csv data/snapshots; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "bbf-bot"
          git config user.email "bbf-bot@users.noreply.github.com"
          git add public/data data/api data/season-records.csv data/snapshots
          git commit -m "chore(data): refresh $(date -u +%Y-%m-%d)"
          git push
