name: Deploy to Pages

# One repo, two sites, ONE Pages deploy on every push to main:
#   BlueBloodFootball   → the site root       (bluebloodfootball.com/)
#   BlueBloodBasketball → a subfolder of it   (bluebloodfootball.com/basketball/)
# Basketball is built with base /basketball/ (vite.config.ts) and copied into the football
# artifact, so no second repo, domain or deploy key is involved. Pages "Source" must be
# set to "GitHub Actions" in repo Settings.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:bb
      - name: Publish basketball under /basketball/
        run: cp -r dist-basketball dist/basketball
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
