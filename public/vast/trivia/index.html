<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vast Trivia</title>
<meta name="description" content="Vast Trivia: nearly 49,000 trivia questions, an Elo rating for every player, and question difficulty that sorts itself as people play.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vast Apps">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  try {
    var s = JSON.parse(localStorage.getItem('vt-settings') || '{}');
    if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
  } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="home" href="../" title="All Vast Apps" aria-label="All Vast Apps"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2h5v5H2zM11 2h5v5h-5zM2 11h5v5H2zM11 11h5v5h-5z" fill="currentColor"/></svg></a>
    <a class="brand" href="#play">VAST TRIVIA</a>
    <nav class="tabs" aria-label="Sections">
      <a href="#play" data-tab="play">Play</a>
      <a href="#stats" data-tab="stats">Stats</a>
      <a href="#players" data-tab="players">Players</a>
    </nav>
    <button class="who" id="who" type="button" title="Switch player"><span id="who-name"></span><b id="who-rating"></b></button>
  </div>
</header>

<main id="app"></main>

<footer class="foot">
  <p>Questions from <a href="https://github.com/uberspot/OpenTriviaQA" rel="noopener">OpenTriviaQA</a>, licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener">CC BY-SA 4.0</a>, lightly cleaned. Ratings and progress are saved in this browser.</p>
</footer>

<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});</script>
</body>
</html>
