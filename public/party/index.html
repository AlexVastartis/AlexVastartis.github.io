<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f6f3ff; --surface:#ffffff; --surface-2:#ece7fb; --text:#1b1530; --muted:#6a6385;
  --line:#ddd6f3; --accent:#7c4dff; --accent-ink:#fff; --good:#16a34a; --bad:#e5484d; --warn:#f59e0b;
  --shadow:0 6px 20px rgba(40,20,90,.10);
  --c1:#7c4dff; --c2:#ff4d8d; --c3:#ff8a00; --c4:#00b37e; --c5:#0091ff; --c6:#e5484d; --c7:#a855f7; --c8:#14b8a6; --c9:#eab308; --c10:#ef4444; --c11:#6366f1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14101f; --surface:#1f1931; --surface-2:#2a2340; --text:#f4f0ff; --muted:#a59cc4;
    --line:#352c52; --accent:#9b7bff; --accent-ink:#12091f; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14101f; --surface:#1f1931; --surface-2:#2a2340; --text:#f4f0ff; --muted:#a59cc4;
  --line:#352c52; --accent:#9b7bff; --accent-ink:#12091f; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
body{min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 16px)}
header{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:8px}
header h1{font-size:20px;margin:0;flex:1;font-weight:800;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:20px}
main{flex:1;display:flex;flex-direction:column;gap:12px}
.hero{padding:8px 2px 4px}
.hero h2{font-size:34px;margin:0;font-weight:900;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{position:relative;text-align:left;border-radius:22px;padding:14px;min-height:124px;color:#fff;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);overflow:hidden;transition:transform .12s}
.game:active{transform:scale(.97)}
.game .em{font-size:34px;line-height:1}
.game b{font-size:17px;display:block;margin-top:8px}
.game small{opacity:.9;font-size:12.5px;line-height:1.25;display:block;margin-top:2px}
.section-label{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:8px 2px 0}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:18px;
  background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px;width:100%;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.btn.good{background:var(--good);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.big{min-height:72px;font-size:22px;border-radius:22px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}
.prompt{font-size:clamp(26px,7.5vw,40px);font-weight:850;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.kicker{font-size:14px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted)}
.center{text-align:center}
.bigcard{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;
  border-radius:28px;padding:24px;color:#fff;min-height:300px;box-shadow:var(--shadow)}
.bigcard .kicker{color:rgba(255,255,255,.85)}
input[type=text]{font:inherit;font-size:18px;width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--text);outline:none}
input[type=text]:focus{border-color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 10px 10px 14px;box-shadow:var(--shadow);font-weight:700;font-size:17px}
.pitem .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px}
.pitem span{flex:1}
.pitem button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);font-size:16px}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt label{font-weight:700;font-size:14px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:10px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:15px;border:2px solid transparent}
.pill.on{border-color:var(--accent);color:var(--accent)}
.score{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-weight:700}
.score b{font-size:22px}
.muted{color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:900}
.ring{width:220px;height:220px;position:relative;display:grid;place-items:center;margin:0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .num{font-size:84px;font-weight:900;font-variant-numeric:tabular-nums}
/* full-screen overlays */
.full{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px);user-select:none;-webkit-user-select:none}
.full .x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.25);color:#fff;font-size:20px;z-index:3}
.tapzones{position:absolute;inset:0;display:flex}
.tapzones button{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom) + 22px);font-weight:800;font-size:18px;color:rgba(255,255,255,.85)}
.fhword{font-size:clamp(44px,13vw,110px);font-weight:900;line-height:1.05;padding:0 24px;pointer-events:none;position:relative;z-index:2;text-wrap:balance}
.fhtime{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px;font-size:30px;font-weight:900;z-index:2;pointer-events:none}
.flash{animation:flash .35s ease}
@keyframes flash{0%{filter:brightness(1.8)}100%{filter:brightness(1)}}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate3d(-2px,0,0)}20%,80%{transform:translate3d(4px,0,0)}30%,50%,70%{transform:translate3d(-8px,0,0)}40%,60%{transform:translate3d(8px,0,0)}}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.bomb{font-size:140px;line-height:1;transition:transform .1s}
.wyr{flex:1;display:flex;flex-direction:column;gap:10px;min-height:420px}
.wyr button{flex:1;border-radius:26px;color:#fff;font-size:clamp(22px,6.5vw,32px);font-weight:850;padding:20px;line-height:1.2;box-shadow:var(--shadow);text-wrap:balance;position:relative}
.wyr .or{align-self:center;font-weight:900;color:var(--muted);font-size:15px;letter-spacing:.1em}
.pct{display:block;font-size:15px;opacity:.9;margin-top:8px}
/* finger chooser */
#chooser{position:fixed;inset:0;z-index:20;background:#0c0916;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#chooser .hint{position:absolute;inset:0;display:grid;place-items:center;color:#cfc6ef;text-align:center;font-weight:800;font-size:24px;padding:24px;pointer-events:none}
.finger{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;pointer-events:none;transition:opacity .4s,transform .4s;
  box-shadow:0 0 0 6px rgba(255,255,255,.12)}
.finger.alive{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.finger.win{transform:scale(1.5);box-shadow:0 0 0 14px rgba(255,255,255,.5),0 0 60px 20px currentColor;animation:none}
.finger.lose{opacity:0;transform:scale(.3)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:50}
.hidden{display:none!important}
.rotate-tip{font-size:15px;color:var(--muted)}
.list{margin:0;padding-left:20px;line-height:1.6}
</style>
</head>

const store = {
  get(k, d) { try { const v = localStorage.getItem("pp:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pp:" + k, JSON.stringify(v)); } catch {} }
};
let players = store.get("players", []);
const savePlayers = () => store.set("players", players);
const pColor = i => RAW[i % RAW.length];

let cleanups = [];
function onCleanup(fn) { cleanups.push(fn); }
function runCleanup() { cleanups.forEach(f => { try { f(); } catch {} }); cleanups = []; document.querySelectorAll(".full,#chooser").forEach(e => e.remove()); }
function every(ms, fn) { const id = setInterval(fn, ms); onCleanup(() => clearInterval(id)); return id; }
function later(ms, fn) { const id = setTimeout(fn, ms); onCleanup(() => clearTimeout(id)); return id; }

// sound + haptics
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (actx.state === "suspended") actx.resume(); return actx; }
let soundOn = store.get("sound", true);
function beep(freq = 660, dur = .08, type = "sine", vol = .2) {
  if (!soundOn) return; const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur + .02);
}
function boom() {
  if (!soundOn) return; const a = audio(); if (!a) return;
  const len = a.sampleRate * 1.2, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = "lowpass"; f.frequency.value = 700; g.gain.value = .9;
  src.connect(f).connect(g).connect(a.destination); src.start();
}
const ding = () => { beep(880, .12, "triangle", .25); setTimeout(() => beep(1320, .18, "triangle", .2), 90); };
const buzz = () => beep(140, .45, "sawtooth", .25);
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

let wake = null;
async function keepAwake() { try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && currentGame) keepAwake(); });
function toast(msg) { const t = document.createElement("div"); t.className = "toast pop"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

/* ------------------------------------------------------------------ shell */
let currentGame = null;
function screen(title, body, { back = true, right = "" } = {}) {
  app.innerHTML = `<header>${back ? `<button class="iconbtn" data-act="home" aria-label="Back to games">←</button>` : ""}<h1>${title}</h1>${right}</header><main>${body}</main>`;
  app.querySelectorAll('[data-act="home"]').forEach(b => b.onclick = home);
  window.scrollTo(0, 0);
}
// tap once to arm, tap again within 3s to confirm (browser confirm() dialogs are blocked in some viewers)
function twoTap(el, label, fn) {
  if (el.dataset.armed) { fn(); return; }
  const orig = el.innerHTML; el.dataset.armed = "1"; el.innerHTML = label; vib(15);
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.innerHTML = orig; } }, 3000);
}
function on(sel, fn, root = app) { root.querySelectorAll(sel).forEach(el => el.onclick = e => { audio(); fn(e, el); }); }
function full(bg, html) {
  const d = document.createElement("div"); d.className = "full"; d.style.background = bg; d.innerHTML = html;
  document.body.appendChild(d); return d;
}

const GAMES = [

  { id: "charades", name: "Team Charades", em: "🎭", color: "var(--c4)", desc: "Act it out. Two teams, one timer.", fn: gCharades, type: "guess" },
  { id: "quick", name: "Quick Three", em: "⏱️", color: "var(--c5)", desc: "Name 3 things in 5 seconds. Then pass.", fn: gQuick, type: "pass" },
  { id: "tod", name: "Truth or Dare", em: "🔥", color: "var(--c2)", desc: "The classic, with names and turns.", fn: gTod, type: "talk" },
  { id: "nhie", name: "Never Have I Ever", em: "🙈", color: "var(--c7)", desc: "Fingers up. Confess or keep quiet.", fn: gNhie, type: "talk" },
  { id: "wyr", name: "Would You Rather", em: "🤔", color: "var(--c8)", desc: "Two choices. Defend your answer.", fn: gWyr, type: "talk" },
  { id: "mlt", name: "Most Likely To", em: "👉", color: "var(--c11)", desc: "Count down, then everyone points.", fn: gMlt, type: "talk" },
  { id: "chooser", name: "Finger Chooser", em: "☝️", color: "var(--c9)", desc: "Everyone touches the screen. Fate picks one.", fn: gChooser, type: "tool" },
];

function home() {
  runCleanup(); currentGame = null;
  if (wake) { try { wake.release(); } catch {} wake = null; }
  const card = g => `<button class="game" style="background:${g.color}" data-g="${g.id}"><span class="em">${g.em}</span><span><b>${g.name}</b><small>${g.desc}</small></span></button>`;
  const sect = (label, t) => `<div class="section-label">${label}</div><div class="grid">${GAMES.filter(g => g.type === t).map(card).join("")}</div>`;
  screen("", `
    <div class="hero"><h2>Vast Party Games 🎉</h2><p>Party games for one phone. Pick a game, pass it around.</p></div>
    <div class="row" style="flex:0">
      <button class="chip" id="pbtn" style="flex:1;justify-content:center">👥 ${players.length ? `${players.length} player${players.length > 1 ? "s" : ""}` : "Add players"}</button>
      <button class="chip" id="sbtn" style="flex:0 0 auto" aria-label="Toggle sound">${soundOn ? "🔊" : "🔇"}</button>
    </div>
    ${sect("Pass the phone", "pass")}
    ${sect("Guess the word", "guess")}
    ${sect("Talk & confess", "talk")}
    ${sect("Tools", "tool")}
    <p class="muted center" style="font-size:13px;margin-top:8px">Works offline. Add to your home screen to use it like an app.</p>
  `, { back: false });
  on(".game", (e, el) => { const g = GAMES.find(x => x.id === el.dataset.g); currentGame = g; keepAwake(); g.fn(); });
  on("#pbtn", () => playersScreen(home));
  on("#sbtn", () => { soundOn = !soundOn; store.set("sound", soundOn); home(); });
}

function playersScreen(after, need = 0) {
  const render = () => {
    screen("Players", `
      <form id="addf" class="row" style="flex:0"><input type="text" id="pname" placeholder="Add a name" maxlength="20" autocomplete="off" enterkeyhint="done"><button class="btn" style="flex:0 0 72px" type="submit">Add</button></form>
      <div class="plist">${players.map((p, i) => `<div class="pitem"><span class="dot" style="background:${pColor(i)}">${esc(p[0].toUpperCase())}</span><span>${esc(p)}</span><button data-up="${i}" aria-label="Move up">↑</button><button data-del="${i}" aria-label="Remove">✕</button></div>`).join("") || `<div class="card muted center">No players yet. Names are used for turns and the Imposter game.</div>`}</div>
      ${need ? `<p class="muted center">This game needs at least ${need} players.</p>` : ""}
      <div class="spacer"></div>
      ${players.length ? `<button class="btn ghost" id="clear">Clear all</button>` : ""}
      <button class="btn big" id="done" ${players.length < need ? "disabled" : ""}>Done</button>
    `);
    const inp = $("#pname");
    $("#addf").onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); if (!v) return; if (players.some(p => p.toLowerCase() === v.toLowerCase())) { toast("Already added"); return; } players.push(v); savePlayers(); render(); $("#pname").focus(); };
    on("[data-del]", (e, el) => { players.splice(+el.dataset.del, 1); savePlayers(); render(); });
    on("[data-up]", (e, el) => { const i = +el.dataset.up; if (i > 0) { [players[i - 1], players[i]] = [players[i], players[i - 1]]; savePlayers(); render(); } });
    on("#clear", (e, el) => twoTap(el, "Tap again to remove everyone", () => { players = []; savePlayers(); render(); }));
    on("#done", () => after());
  };
  render();
}
function needPlayers(n, then) { if (players.length >= n) then(); else playersScreen(() => players.length >= n ? then() : home(), n); }

function deckPills(id, selected, multi = true) {
  return `<div class="pills" id="${id}">${Object.keys(DECKS).map(k => `<button class="pill ${selected.includes(k) ? "on" : ""}" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>`;
}
function bindPills(id, selected, multi = true) {
  on(`#${id} .pill`, (e, el) => {
    const k = el.dataset.k;
    if (!multi) { selected.length = 0; selected.push(k); document.querySelectorAll(`#${id} .pill`).forEach(p => p.classList.toggle("on", p === el)); return; }
    const i = selected.indexOf(k);
    if (i >= 0) { if (selected.length > 1) selected.splice(i, 1); } else selected.push(k);
    el.classList.toggle("on", selected.includes(k));
  });
}
function seg(id, opts, val) { return `<div class="seg" id="${id}">${opts.map(([v, l]) => `<button data-v="${v}" class="${v == val ? "on" : ""}">${l}</button>`).join("")}</div>`; }
function bindSeg(id, cb) { on(`#${id} button`, (e, el) => { document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle("on", b === el)); cb(el.dataset.v); }); }
const wordsFrom = sel => sel.flatMap(k => DECKS[k]);
function countdown3(bg, then) {
  const d = full(bg, `<div class="kicker" style="color:#fff">Get ready</div><div class="fhword pop" id="cd">3</div>`);
  let n = 3; beep(520, .1);
  const id = setInterval(() => { n--; if (n === 0) { clearInterval(id); d.remove(); beep(990, .2, "triangle"); then(); return; } d.querySelector("#cd").textContent = n; d.querySelector("#cd").classList.remove("pop"); void d.offsetWidth; d.querySelector("#cd").classList.add("pop"); beep(520, .1); }, 900);
  onCleanup(() => clearInterval(id));
}

/* ------------------------------------------------------------------ Pass the Bomb */
function gBomb() {
  let mode = store.get("bomb:mode", "mix"), len = store.get("bomb:len", "med");
  const nextCat = deck(BOMB_CATS), nextSyl = deck(BOMB_SYL);
  screen("💣 Pass the Bomb", `
    <div class="card stack">
      <div>A topic appears. Say something that fits, then <b>pass the phone</b> to the next person. Nobody knows when the bomb goes off. Whoever's holding it loses the round.</div>
    </div>
    <div class="opt"><label>Prompts</label>${seg("bm", [["cat", "Categories"], ["syl", "Letters"], ["mix", "Mix"]], mode)}</div>
    <div class="opt"><label>Fuse</label>${seg("bl", [["short", "10–25s"], ["med", "20–45s"], ["long", "40–75s"]], len)}</div>
    <div class="spacer"></div>
    <button class="btn big" id="go" style="background:var(--c6);color:#fff">Light the fuse</button>`);
  bindSeg("bm", v => { mode = v; store.set("bomb:mode", v); });
  bindSeg("bl", v => { len = v; store.set("bomb:len", v); });
  on("#go", round);
  function round() {
    const useSyl = mode === "syl" || (mode === "mix" && Math.random() < .4);
    const prompt = useSyl ? `Words containing<br><span style="font-size:1.6em;letter-spacing:.05em">“${nextSyl()}”</span>` : esc(nextCat());
    const [lo, hi] = { short: [10, 25], med: [20, 45], long: [40, 75] }[len];
    const total = (lo + Math.random() * (hi - lo)) * 1000, start = performance.now();
    const d = full("var(--c6)", `<button class="x" aria-label="Stop">✕</button>
      <div class="kicker" style="color:rgba(255,255,255,.85)">Say one, then pass!</div>
      <div class="prompt" style="margin:14px 0 26px">${prompt}</div>
      <div class="bomb" id="bomb">💣</div>
      <button class="btn big" id="pass" style="background:rgba(0,0,0,.25);color:#fff;margin-top:30px;max-width:340px">Passed ➜</button>`);
    d.querySelector(".x").onclick = () => { runCleanup(); gBomb(); };
    let passes = 0;
    d.querySelector("#pass").onclick = () => { passes++; vib(15); beep(700, .05); };
    let nextTick = 0;
    const raf = () => {
      const t = performance.now() - start, f = t / total;
      if (f >= 1) return explode();
      const gap = 600 - 480 * f; // ticks speed up
      if (t >= nextTick) { nextTick = t + gap; beep(f > .75 ? 1100 : 900, .03, "square", .12); const b = d.querySelector("#bomb"); b.style.transform = "scale(1.12)"; setTimeout(() => b.style.transform = "", 80); }
      rid = requestAnimationFrame(raf);
    };
    let rid = requestAnimationFrame(raf); onCleanup(() => cancelAnimationFrame(rid));
    function explode() {
      boom(); vib([400, 100, 400]);
      d.style.background = "#111"; d.classList.add("shake");
      d.innerHTML = `<div class="bomb pop">💥</div><div class="prompt" style="margin-top:12px">BOOM!</div>
        <p style="font-size:19px;opacity:.9">Whoever's holding the phone loses this round.</p>
        <p style="opacity:.6">${passes} pass${passes === 1 ? "" : "es"}</p>
        <div class="stack" style="width:100%;max-width:340px;margin-top:16px">
          <button class="btn big" id="again" style="background:var(--c6);color:#fff">Next round</button>
          <button class="btn" id="out" style="background:rgba(255,255,255,.12);color:#fff">Back</button></div>`;
      d.querySelector("#again").onclick = () => { runCleanup(); gBomb(); setTimeout(round, 0); };
      d.querySelector("#out").onclick = () => { runCleanup(); gBomb(); };
    }
  }
}

/* ------------------------------------------------------------------ Imposter */
function gImposter() {
  needPlayers(3, setup);
  function setup() {
    const sel = store.get("imp:decks", ["Places"]).filter(k => DECKS[k]); if (!sel.length) sel.push("Places");
    let imps = Math.min(store.get("imp:n", 1), players.length > 4 ? 2 : 1), hint = store.get("imp:hint", true);
    screen("🕵️ Imposter", `
      <div class="card">Everyone gets the same secret word, except the <b>imposter</b>. Take turns giving one-word clues, then vote. Imposter wins by blending in or guessing the word.</div>
      <div class="chip" id="pp" style="align-self:flex-start">👥 ${players.map(esc).join(", ")} ✎</div>
      <div class="opt"><label>Word category</label>${deckPills("idk", sel)}</div>
      <div class="opt"><label>Imposters</label>${seg("in", [[1, "1"], [2, "2"]], imps)}</div>
      <div class="opt"><label>Imposter sees the category?</label>${seg("ih", [["1", "Yes"], ["0", "No"]], hint ? "1" : "0")}</div>
      <div class="spacer"></div>
      <button class="btn big" id="go">Deal roles</button>`);
    bindPills("idk", sel); bindSeg("in", v => imps = +v); bindSeg("ih", v => hint = v === "1");
    on("#pp", () => playersScreen(gImposter, 3));
    on("#go", () => {
      if (imps >= players.length - 1) imps = 1;
      store.set("imp:decks", sel); store.set("imp:n", imps); store.set("imp:hint", hint);
      const cat = pick(sel), word = pick(DECKS[cat]);
      const order = players.slice(), impSet = new Set(shuffle(order.map((_, i) => i)).slice(0, imps));
      deal(order, impSet, cat, word, hint, 0);
    });
  }
  function deal(order, impSet, cat, word, hint, i) {
    if (i >= order.length) return discuss(order, impSet, cat, word);
    const name = esc(order[i]);
    screen("🕵️ Imposter", `
      <div class="bigcard" style="background:${pColor(i)}">
        <div class="kicker">Player ${i + 1} of ${order.length}</div>
        <div class="prompt">Pass the phone to<br>${name}</div>
        <p style="opacity:.85;margin:0">Don't let anyone else see the screen.</p>
      </div>
      <button class="btn big" id="rev">I'm ${name} — reveal</button>`);
    on("#rev", () => {
      const isImp = impSet.has(i);
      screen("🕵️ Imposter", `
        <div class="bigcard pop" style="background:${isImp ? "#1a1a1a" : pColor(i)}">
          <div class="kicker">${name}, you are…</div>
          ${isImp ? `<div class="prompt">🕵️ The IMPOSTER</div><p style="opacity:.85;margin:0">${hint ? `Category: <b>${esc(cat)}</b>. ` : ""}Blend in. Figure out the word.</p>`
                  : `<div class="kicker">The secret word</div><div class="prompt" style="font-size:clamp(34px,10vw,56px)">${esc(word)}</div><p style="opacity:.85;margin:0">Category: ${esc(cat)}</p>`}
        </div>
        <button class="btn big" id="hide">Got it — hide</button>`);
      vib(20);
      on("#hide", () => deal(order, impSet, cat, word, hint, i + 1));
    });
  }
  function discuss(order, impSet, cat, word) {
    const starter = pick(order);
    let secs = 0;
    screen("🕵️ Imposter", `
      <div class="card stack center">
        <div class="kicker">Category: ${esc(cat)}</div>
        <div class="prompt">${esc(starter)} goes first</div>
        <p class="muted" style="margin:0">Go around the circle. Everyone gives one clue about the word. Do 2 rounds, then vote on who the imposter is.</p>
        <div class="timer" id="t" style="font-size:40px">0:00</div>
      </div>
      <div class="spacer"></div>
      <button class="btn big" id="rv" style="background:#1a1a1a;color:#fff">Reveal the imposter${impSet.size > 1 ? "s" : ""}</button>
      <button class="btn ghost" id="new">New round</button>`);
    every(1000, () => { secs++; const t = $("#t"); if (t) t.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`; });
    on("#new", () => { runCleanup(); gImposter(); });
    on("#rv", (e, el) => twoTap(el, "Voted? Tap again to reveal", () => {
      runCleanup();
      const names = [...impSet].map(i => esc(order[i])).join(" & ");
      boom(); vib(200);
      screen("🕵️ Imposter", `
        <div class="bigcard pop" style="background:#1a1a1a">
          <div class="kicker">The imposter${impSet.size > 1 ? "s were" : " was"}</div>
          <div class="prompt">${names}</div>
          <div class="kicker">The word was</div>
          <div class="prompt">${esc(word)}</div>
          <p style="opacity:.8;margin:0">Imposter caught? Give them one guess at the word to steal the win.</p>
        </div>
        <button class="btn big" id="again">Play again</button>`);
      on("#again", gImposter);
    }));
  }
}

/* ------------------------------------------------------------------ Forehead */
function gForehead() {
  const sel = store.get("fh:decks", ["Animals", "Food", "Things"]).filter(k => DECKS[k]); if (!sel.length) sel.push("Animals");
  let secs = store.get("fh:secs", 60);
  screen("🤯 Forehead", `
    <div class="card">Hold the phone on your forehead, screen facing out. Friends shout clues. Tap the <b>right side</b> when you get it, <b>left side</b> to pass.</div>
    <div class="opt"><label>Decks</label>${deckPills("fdk", sel)}</div>
    <div class="opt"><label>Time</label>${seg("fs", [[30, "30s"], [60, "60s"], [90, "90s"], [120, "2 min"]], secs)}</div>
    <p class="rotate-tip center">Tip: turn the phone sideways and lock rotation off for bigger words.</p>
    <div class="spacer"></div>
    <button class="btn big" id="go" style="background:var(--c3);color:#fff">Start</button>`);
  bindPills("fdk", sel); bindSeg("fs", v => secs = +v);
  on("#go", () => { store.set("fh:decks", sel); store.set("fh:secs", secs); countdown3("var(--c3)", () => play(wordsFrom(sel), secs)); });
  function play(words, secs) {
    const next = deck(words), log = [];
    let word = next(), left = secs, done = false;
    const d = full("var(--c3)", `<button class="x" aria-label="Stop">✕</button>
      <div class="fhtime" id="tm">${left}</div>
      <div class="fhword pop" id="w">${esc(word)}</div>
      <div class="tapzones"><button id="ps">← Pass</button><button id="ok">Got it →</button></div>`);
    const W = d.querySelector("#w");
    const show = (bg) => { d.style.background = bg; d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash"); word = next(); W.textContent = word; W.classList.remove("pop"); void W.offsetWidth; W.classList.add("pop"); later(350, () => { if (!done) d.style.background = "var(--c3)"; }); };
    d.querySelector("#ok").onclick = () => { if (done) return; log.push([word, true]); ding(); vib(30); show("var(--good)"); };
    d.querySelector("#ps").onclick = () => { if (done) return; log.push([word, false]); beep(300, .12, "triangle"); vib([10, 40, 10]); show("var(--bad)"); };
    d.querySelector(".x").onclick = () => end();
    every(1000, () => { left--; d.querySelector("#tm").textContent = left; if (left <= 5 && left > 0) beep(1000, .06, "square", .15); if (left <= 0) end(); });
    function end() {
      if (done) return; done = true; runCleanup(); buzz(); vib(300);
      const got = log.filter(x => x[1]).length;
      screen("🤯 Forehead", `
        <div class="card center stack"><div class="kicker">Time's up!</div><div class="prompt">${got} correct</div></div>
        <div class="card"><ul class="list">${log.map(([w, ok]) => `<li style="color:${ok ? "var(--good)" : "var(--muted)"}">${ok ? "✓" : "✗"} ${esc(w)}</li>`).join("") || "<li class='muted'>No words played</li>"}</ul></div>
        <div class="spacer"></div>
        <button class="btn big" id="again" style="background:var(--c3);color:#fff">Next player</button>
        <button class="btn ghost" id="set">Change decks</button>`);
      on("#again", () => countdown3("var(--c3)", () => play(words, secs)));
      on("#set", gForehead);
    }
  }
}

  screen("🎭 Team Charades", `
    <div class="card">Split into two teams. The actor sees the word and acts it out, no talking! Their team guesses. Tap <b>Got it</b> or <b>Skip</b>, then pass to the other team.</div>
    <div class="row" style="flex:0"><input type="text" id="t1" value="Team 1" maxlength="16"><input type="text" id="t2" value="Team 2" maxlength="16"></div>
    <div class="opt"><label>Decks</label>${deckPills("cdk", sel)}</div>
    <div class="opt"><label>Turn length</label>${seg("cs", [[45, "45s"], [60, "60s"], [90, "90s"]], secs)}</div>
    <div class="opt"><label>Play to</label>${seg("ct", [[10, "10"], [15, "15"], [25, "25"], [999, "∞"]], target)}</div>
    <div class="spacer"></div>
    <button class="btn big" id="go" style="background:var(--c4);color:#fff">Start game</button>`);
  bindPills("cdk", sel); bindSeg("cs", v => secs = +v); bindSeg("ct", v => target = +v);
  on("#go", () => {
    teams[0].name = $("#t1").value.trim() || "Team 1"; teams[1].name = $("#t2").value.trim() || "Team 2";
    store.set("ch:decks", sel); store.set("ch:secs", secs); store.set("ch:target", target);
    next = deck(wordsFrom(sel)); between();
  });
  const board = () => `<div class="stack">${teams.map((t, i) => `<div class="score" style="${i === turn ? `outline:3px solid ${t.color}` : ""}"><span>${esc(t.name)}</span><b>${t.score}</b></div>`).join("")}</div>`;
  function between() {
    const winner = teams.find(t => t.score >= target);
    if (winner) {
      screen("🎭 Team Charades", `<div class="bigcard pop" style="background:${winner.color}"><div class="kicker">Winner</div><div class="prompt">🏆 ${esc(winner.name)}</div></div>${board()}<button class="btn big" id="again">New game</button>`);
      ding(); on("#again", gCharades); return;
    }
    const t = teams[turn];
    screen("🎭 Team Charades", `
      ${board()}
      <div class="bigcard" style="background:${t.color}"><div class="kicker">Up next</div><div class="prompt">${esc(t.name)}</div><p style="margin:0;opacity:.9">Pick an actor. Only they look at the screen.</p></div>
      <button class="btn big" id="go">Start turn (${secs}s)</button>
      <button class="btn ghost" id="end">End game</button>`);
    on("#go", () => countdown3(t.color, () => play(t)));
    on("#end", () => { const w = teams[0].score === teams[1].score ? null : teams[0].score > teams[1].score ? teams[0] : teams[1]; screen("🎭 Team Charades", `<div class="bigcard" style="background:${w ? w.color : "var(--c1)"}"><div class="kicker">Final</div><div class="prompt">${w ? "🏆 " + esc(w.name) : "It's a tie!"}</div></div>${board()}<button class="btn big" id="again">New game</button>`); on("#again", gCharades); });
  }
  function play(t) {
    let left = secs, word = next(), got = 0, done = false;
    const d = full(t.color, `<button class="x" aria-label="End turn">✕</button>
      <div class="fhtime" id="tm">${left}</div>
      <div class="kicker" style="color:rgba(255,255,255,.85)">Act out</div>
      <div class="fhword pop" id="w" style="margin:10px 0 40px">${esc(word)}</div>
      <div class="row" style="width:100%;max-width:420px;position:relative;z-index:2"><button class="btn big" id="sk" style="background:rgba(0,0,0,.25);color:#fff">Skip</button><button class="btn big" id="ok" style="background:#fff;color:#111">Got it ✓</button></div>
      <div style="margin-top:16px;font-weight:800;font-size:20px" id="gc">0 this turn</div>`);
    const W = d.querySelector("#w");
    const nw = () => { word = next(); W.textContent = word; W.classList.remove("pop"); void W.offsetWidth; W.classList.add("pop"); };
    d.querySelector("#ok").onclick = () => { if (done) return; got++; t.score++; d.querySelector("#gc").textContent = `${got} this turn`; ding(); vib(30); nw(); };
    d.querySelector("#sk").onclick = () => { if (done) return; beep(300, .1, "triangle"); nw(); };
    d.querySelector(".x").onclick = () => end();
    every(1000, () => { left--; d.querySelector("#tm").textContent = left; if (left <= 5 && left > 0) beep(1000, .06, "square", .15); if (left <= 0) end(); });
    function end() { if (done) return; done = true; runCleanup(); buzz(); vib(300); toast(`${t.name}: +${got}`); turn = 1 - turn; between(); }
  }
}

/* ------------------------------------------------------------------ Quick Three */
function gQuick() {
  const next = deck(QUICK);
  const scores = players.map(() => 0);
  let i = 0;
  turn();
  function turn() {
    const has = players.length > 0, name = has ? esc(players[i % players.length]) : "";
    const q = next();
    screen("⏱️ Quick Three", `
      ${has ? `<div class="kicker center">${name}'s turn</div>` : ""}
      <div class="bigcard" style="background:var(--c5)"><div class="prompt" id="q">${esc(q)}</div>
        <div class="ring" id="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" stroke="rgba(255,255,255,.25)" stroke-width="16" fill="none"/><circle id="arc" cx="110" cy="110" r="96" stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="0"/></svg><div class="num" id="n">5</div></div>
      </div>
      <button class="btn big" id="go">Start 5 seconds</button>
      ${has ? `<div class="row hidden" id="res" style="flex:0"><button class="btn bad big" id="miss">Missed</button><button class="btn good big" id="hit">Made it</button></div>` : `<button class="btn ghost hidden" id="nx">Next prompt</button>`}
      ${has ? `<details class="card"><summary style="font-weight:800">Scoreboard</summary><div class="stack" style="margin-top:10px">${players.map((p, k) => `<div class="score"><span>${esc(p)}</span><b>${scores[k]}</b></div>`).join("")}</div></details>` : `<p class="muted center">Add players on the home screen to keep score.</p>`}`);
    on("#go", (e, b) => {
      b.disabled = true; const t0 = performance.now(), D = 5000; beep(700, .08);
      let last = 5;
      const tick = () => {
        const el = performance.now() - t0, rem = Math.max(0, D - el), s = Math.ceil(rem / 1000);
        const arc = $("#arc"); if (!arc) return; arc.setAttribute("stroke-dashoffset", String(603 * (el / D)));
        if (s !== last) { last = s; $("#n").textContent = s; if (s > 0) beep(700, .06); }
        if (rem <= 0) { buzz(); vib(300); $("#n").textContent = "⏰"; b.classList.add("hidden"); (has ? $("#res") : $("#nx")).classList.remove("hidden"); return; }
        rid = requestAnimationFrame(tick);
      };
      let rid = requestAnimationFrame(tick); onCleanup(() => cancelAnimationFrame(rid));
    });
    on("#hit", () => { scores[i % players.length]++; ding(); i++; turn(); });
    on("#miss", () => { i++; turn(); });
    on("#nx", turn);
  }
}

/* ------------------------------------------------------------------ Truth or Dare */
function gTod() {
  const nT = deck(TRUTHS), nD = deck(DARES);
  let i = Math.floor(Math.random() * Math.max(players.length, 1));
  choose();
  function choose() {
    const name = players.length ? esc(players[i % players.length]) : "";
    screen("🔥 Truth or Dare", `
      <div class="bigcard" style="background:var(--c2)"><div class="kicker">${players.length ? "Your turn" : "Next up"}</div><div class="prompt">${name || "Truth or dare?"}</div>${name ? `<p style="margin:0;opacity:.9">Truth or dare?</p>` : ""}</div>
      <div class="row" style="flex:0"><button class="btn big" id="t" style="background:var(--c5);color:#fff">Truth</button><button class="btn big" id="d" style="background:var(--c6);color:#fff">Dare</button></div>
      <button class="btn ghost" id="r">🎲 Random</button>
      ${players.length ? "" : `<p class="muted center">Add players on the home screen and it'll call out turns.</p>`}`);
    on("#t", () => show("Truth", nT()));
    on("#d", () => show("Dare", nD()));
    on("#r", () => Math.random() < .5 ? show("Truth", nT()) : show("Dare", nD()));
  }
  function show(kind, text) {
    const name = players.length ? esc(players[i % players.length]) + " · " : "";
    screen("🔥 Truth or Dare", `
      <div class="bigcard pop" style="background:${kind === "Truth" ? "var(--c5)" : "var(--c6)"}"><div class="kicker">${name}${kind}</div><div class="prompt">${esc(text)}</div></div>
      <button class="btn big" id="n">Next player</button>
      <button class="btn ghost" id="sw">Swap for another ${kind.toLowerCase()}</button>`);
    vib(20);
    on("#n", () => { i++; choose(); });
    on("#sw", () => show(kind, kind === "Truth" ? nT() : nD()));
  }
}

/* ------------------------------------------------------------------ simple card games */
function cardGame({ title, color, next, sub, extra = "" }) {
  const render = () => {
    screen(title, `
      <div class="bigcard pop" style="background:${color}">${sub ? `<div class="kicker">${sub}</div>` : ""}<div class="prompt">${esc(next())}</div></div>
      ${extra}
      <button class="btn big" id="n">Next card</button>`);
    on("#n", render);
    bindExtra && bindExtra();
  };
  let bindExtra = null;
  return { render, setBind(f) { bindExtra = f; } };
}
function gNhie() {
  const next = deck(NHIE);
  cardGame({ title: "🙈 Never Have I Ever", color: "var(--c7)", next, sub: "Put a finger down if you have" }).render();
}
function gMlt() {
  const next = deck(MLT);
  const g = cardGame({ title: "👉 Most Likely To", color: "var(--c11)", next, sub: "On the count of 3, everyone points", extra: `<button class="btn ghost" id="cnt">Count me down</button>` });
  g.setBind(() => on("#cnt", () => {
    const d = full("var(--c11)", `<div class="fhword pop" id="c">3</div>`); let n = 3; beep(520, .1);
    const id = setInterval(() => { n--; const c = d.querySelector("#c"); if (n > 0) { c.textContent = n; beep(520, .1); } else if (n === 0) { c.textContent = "POINT! 👉"; beep(990, .3, "triangle"); vib(200); } else { clearInterval(id); d.remove(); } c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); }, 800);
    onCleanup(() => clearInterval(id));
  }));
  g.render();
}
function gWyr() {
  const next = deck(WYR);
  const render = () => {
    const [a, b] = next(); let chosen = false;
    screen("🤔 Would You Rather", `
      <p class="center muted" style="margin:0">Everyone picks. Tap to lock in the majority, then defend your choice.</p>
      <div class="wyr"><button style="background:var(--c8)" id="a">${esc(a)}</button><div class="or">OR</div><button style="background:var(--c2)" id="b">${esc(b)}</button></div>
      <button class="btn big" id="n">Next</button>`);
    const choose = (el, other) => { if (chosen) return; chosen = true; el.classList.add("pop"); el.insertAdjacentHTML("afterbegin", "✓ "); other.style.opacity = ".45"; ding(); };
    on("#a", () => choose($("#a"), $("#b")));
    on("#b", () => choose($("#b"), $("#a")));
    on("#n", render);
  };
  render();
}

/* ------------------------------------------------------------------ Finger Chooser */
function gChooser() {
  let mode = "one";
  const root = document.createElement("div"); root.id = "chooser";
  root.innerHTML = `<button class="x" style="position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:20px;z-index:3" aria-label="Close">✕</button>
    <div style="position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;z-index:3;width:210px" class="seg" id="cm"><button data-v="one" class="on">Pick one</button><button data-v="teams">2 teams</button></div>
    <div class="hint" id="hint">Everyone put a finger on the screen<br><span style="font-size:16px;opacity:.7;font-weight:600">and hold still…</span></div>`;
  document.body.appendChild(root);
  const fingers = new Map(); let timer = null, decided = false, colorIdx = 0;
  const x = root.querySelector(".x");
  x.addEventListener("pointerdown", e => e.stopPropagation());
  x.onclick = () => { runCleanup(); home(); };
  root.querySelector("#cm").addEventListener("pointerdown", e => e.stopPropagation());
  root.querySelectorAll("#cm button").forEach(b => b.onclick = () => { mode = b.dataset.v; root.querySelectorAll("#cm button").forEach(o => o.classList.toggle("on", o === b)); });
  const hint = root.querySelector("#hint");
  const arm = () => {
    clearTimeout(timer); if (decided) return;
    hint.classList.toggle("hidden", fingers.size > 0);
    if (fingers.size >= 2) timer = setTimeout(decide, 2200);
  };
  function decide() {
    decided = true; const list = [...fingers.values()];
    if (mode === "one") {
      const w = pick(list);
      list.forEach(f => { f.el.classList.remove("alive"); f.el.classList.add(f === w ? "win" : "lose"); });
      root.style.background = `radial-gradient(circle at ${w.el.style.left} ${w.el.style.top}, ${w.color}66, transparent 70%), #0c0916`;
    } else {
      const sh = shuffle(list), half = Math.ceil(sh.length / 2);
      sh.forEach((f, k) => { f.el.classList.remove("alive"); const c = k < half ? "#ff4d8d" : "#0091ff"; f.el.style.background = c; f.el.style.color = c; f.el.style.transform = "scale(1.3)"; });
    }
    ding(); vib(250);
  }
  const down = e => {
    e.preventDefault(); audio();
    if (decided && fingers.size === 0) reset();
    if (decided) return;
    const c = RAW[colorIdx++ % RAW.length], el = document.createElement("div");
    el.className = "finger alive"; el.style.background = c; el.style.color = c; el.style.left = e.clientX + "px"; el.style.top = e.clientY + "px";
    root.appendChild(el); fingers.set(e.pointerId, { el, color: c }); beep(400 + fingers.size * 80, .06); arm();
  };
  const move = e => { const f = fingers.get(e.pointerId); if (f) { f.el.style.left = e.clientX + "px"; f.el.style.top = e.clientY + "px"; } };
  const up = e => {
    const f = fingers.get(e.pointerId); if (!f) return;
    fingers.delete(e.pointerId);
    if (!decided) { f.el.remove(); arm(); } else if (fingers.size === 0) setTimeout(() => { if (fingers.size === 0) reset(); }, 1500);
  };
  function reset() { decided = false; root.style.background = "#0c0916"; root.querySelectorAll(".finger").forEach(e => e.remove()); fingers.clear(); colorIdx = 0; hint.classList.remove("hidden"); }
  root.addEventListener("pointerdown", down); root.addEventListener("pointermove", move);
  root.addEventListener("pointerup", up); root.addEventListener("pointercancel", up);
  const noctx = e => e.preventDefault(); root.addEventListener("contextmenu", noctx);
  onCleanup(() => clearTimeout(timer));
}

/* ------------------------------------------------------------------ boot */
home();
if ("serviceWorker" in navigator && /^\/party\//.test(location.pathname)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
